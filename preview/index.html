<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchparty Preview</title>
<style>:root{--g:#218f5b;--ink:#17251f;--cream:#f5efdf}body{margin:0;background:var(--ink);color:var(--cream);font:600 16px system-ui,sans-serif}
